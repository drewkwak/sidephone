    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c94ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#ground)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1.5"/>
  <rect x="10" y="36" width="44" height="38" rx="8" fill="#fff" fill-opacity="0.28"/>
  <rect x="60" y="20" width="26" height="54" rx="8" fill="url(#phone)"/>
